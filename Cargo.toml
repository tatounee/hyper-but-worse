[package]
name = "mon-server"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
color-eyre = "0.6.5"
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
httparse = "1.10.1"
pin-project-lite = "0.2.17"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
